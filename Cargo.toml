[package]
edition = "2021"
name = "bevy_dutch_road_highway_node_network"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { workspace = true, features = [] }
bevy_egui = { workspace = true }
bevy_polyline = { git = "https://github.com/ForesightMiningSoftwareCorporation/bevy_polyline.git", rev = "6a3a02e53a1dfea5b5bfefe99b404b3aa7412a7f" }
highway = { workspace = true }

bincode = { workspace = true }
graph = { workspace = true }
bevy_shapefile = { workspace = true }

rusqlite = { workspace = true }

serde = { workspace = true }
zstd = { workspace = true }

futures-lite = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
harness = false
name = "phase_1_benchmark"

[profile.dev.package.bevy_shapefile]
opt-level = 3

[profile.dev.package.bevy]
opt-level = 3

[workspace]
members = [
    "components/bevy_shapefile",
    "components/graph",
    "components/highway",
    "tools/dbf_to_sql",
]

[workspace.dependencies]
criterion = "0.8.2"
bevy = "0.13"
bevy_egui = "0.27"
bevy_polyline = { git = "https://github.com/ForesightMiningSoftwareCorporation/bevy_polyline.git", rev = "6a3a02e53a1dfea5b5bfefe99b404b3aa7412a7f" }

bevy_shapefile = { path = "./components/bevy_shapefile" }
highway = { path = "./components/highway" }
graph = { path = "./components/graph" }

bincode = "1.3.3"

rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.149"
zstd = "0.13.3"

futures-lite = "2.6.1"
rayon = "1.11.0"
itertools = "0.14.0"

shapefile = "0.7.0"
rstar = "0.12.2"
